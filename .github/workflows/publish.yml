name: Publish to PyPI

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  test:
    name: Lint & Test 🧪
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install uv
        uses: astral-sh/setup-uv@v8
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install 3.12
      - name: Install dependencies
        run: uv sync --all-extras --dev
      - name: Verify tag matches package version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(uv run python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag v$TAG_VERSION does not match pyproject.toml version $PKG_VERSION"
            exit 1
          fi
      - name: Run linting (Ruff)
        run: uv run ruff check .
      - name: Run type-checking (mypy)
        run: uv run mypy .
      - name: Run unit tests
        run: uv run pytest -m "not (integration or vcr)"

  build-n-publish:
    name: Build & publish 📦
    needs: test
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      # OIDC token for PyPI Trusted Publishing (no long-lived API token).
      # Requires the GitHub publisher to be configured on pypi.org for this
      # repo (workflow: publish.yml, environment: pypi).
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v6
      - name: Install uv
        uses: astral-sh/setup-uv@v8
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install 3.12
      - name: Build distribution
        run: uv build
      - name: Publish package to PyPI 🐍 (Trusted Publishing)
        run: uv publish --trusted-publishing always
